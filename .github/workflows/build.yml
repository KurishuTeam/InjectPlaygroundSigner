name: Build Theos Packages

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install gmake
        run: |
          brew install make

      - name: Setup Theos
        run: |
          git clone --recursive https://github.com/theos/theos.git ${{ github.workspace }}/theos
          
          echo "THEOS=${{ github.workspace }}/theos" >> $GITHUB_ENV

      - name: Clean and Build Package
        run: |
          gmake clean 
          gmake package FINALPACKAGE=1 THEOS_PACKAGE_FORMAT=rootless

      - name: Upload iPad Debian Package
        uses: actions/upload-artifact@v4
        with:
          name: InjectPlaygroundSigneriPad-deb
          path: packages/com.kurishu.injectplaygroundsigneripad*.deb
    
      - name: Prepare macOS Dylib
        run: |
          cp .theos/obj/macosx/InjectPlaygroundSignerMac.dylib ./InjectPlaygroundSignerMac.dylib

      - name:
        uses: actions/upload-artifact@v4
        with:
          name: InjectPlaygroundSignerMac-dylib
          path: InjectPlaygroundSignerMac.dylib